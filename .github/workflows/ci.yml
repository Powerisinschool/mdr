name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: cargo test

      - name: Verify README.md matches README.mdr
        uses: ./
        with:
          check: 'true'
