name: Build Profile README

on:
  push:
    branches: [main]
    paths:
      - "README.mdr"
      - "Cargo.toml"
      - "src/**"
      - "scripts/build.sh"
  pull_request:
    branches: [main]
    paths:
      - "README.mdr"
      - "Cargo.toml"
      - "src/**"
      - "scripts/build.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify README on Pull Requests
        if: github.event_name == 'pull_request'
        run: bash scripts/build.sh README --check

      - name: Compile and commit README on push
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/build.sh README
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md images/
          git diff --cached --quiet || git commit -m "chore: compile README.md and sync static images"
          git push
