name: Build Profile README

on:
  push:
    branches: [main]
    paths:
      - "README.mdr"
      - "scripts/mdr.rs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run mdr
        run: |
          rustc -O scripts/mdr.rs -o /tmp/mdr
          /tmp/mdr README.mdr README.md

      - name: Commit updated README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: compile README.md from README.mdr"
          git push
